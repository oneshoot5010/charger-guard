name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android scaffold and apply overrides
        run: |
          flutter create --org com.oneshoot --project-name charger_guard --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          find android/app/src/main -name 'MainActivity.*' -delete
          D=android/app/src/main/kotlin/com/oneshoot/charger_guard
          mkdir -p $D
          cp android_overrides/*.kt $D/
          cp -r res_overrides/. android/app/src/main/res/
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Restore fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "fixed key restored"
          else
            echo "no fixed key secret - random key will be used"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk charger-guard.apk
          gh release create "v$V" charger-guard.apk --repo "${{ github.repository }}" --title "حارس الشاحن $V" --notes-file RELEASE_NOTES.md --latest \
            || gh release upload "v$V" charger-guard.apk --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: charger-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
